<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.webmanifest">
    <title>Spotify 2</title>
</head>
<body>

<header>
      <h1 id="titulo">Spotify 2</h1>
</header>

<main>
      <div id="esquerda"><h1>Adicionar Música</h1>
            <form>
                  <input type="text" id="nome" placeholder="Nome...">
                  <input type="text" id="audio" placeholder="Link da música...">
                  <button type="submit" id="btn-adicionar">Adicionar</button>
            </form>
      </div>

      <div id="meio">
            <div id=""><input type="text" name="busca" id="busca"></div>
            <ul id="musicas"></ul>
      </div>

      <div id="direita"></div>
</main>

<footer>
      <audio id="audioPlayer" src=""></audio>

      <button id="play">Play</button>
      <button id="pause">Pause</button>

      <input id="volume" type="range" min="0" max="1" step="0.01" value="1">
</footer>

<script type="module" src="main.js"></script>

</body>
</html>
